<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./output.css">
    <title>Snake Game</title>
    <style>
        html {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="bg-black text-yellow-200 font-mono p-12 size-full">
    
    <main class="size-full flex flex-col gap-2">
            <div class="infos flex place-content-between text-3xl">
                <div class="info1 border border-yellow-200  p-5 rounded-xl">
                    High Score: <span id="high-score">0</span>
                </div>
                <div class="info2 border border-yellow-200  p-5 rounded-xl">
                    Score: <span id="score">0</span>
                </div>
                <div class="info3 border border-yellow-200  p-5 rounded-xl">
                    Time: <span id="time">00:00</span>
                </div>
            </div>
            <div class="board size-full grow border grid">
               
            </div>
            <div class="start h-dvh w-dvw fixed text-2xl text-yellow-200 top-0 bg-transparent backdrop-blur-xs flex flex-col gap-2 items-center justify-center">
                WELCOME to Snake Game.
                <button class="start-button border-2 rounded-md border-amber-200 px-5 py-2 cursor-pointer hover:scale-102 active:text-green-300 active:border-green-300">
                    START
                </button>
            </div>
             <div class="game-over h-dvh w-dvw fixed text-2xl text-yellow-200 top-0 bg-transparent backdrop-blur-xs flex flex-col gap-2 items-center justify-center hidden">
                GAME OVER.
                <button class="restart-button border-2 rounded-md border-amber-200 px-3 py-1 cursor-pointer hover:scale-102 active:text-green-300 active:border-green-300">
                    RESTART
                </button>
            </div>
    </main>
     

    <script src="script.js"></script>
</body>
</html>
